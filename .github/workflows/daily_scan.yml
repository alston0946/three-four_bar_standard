name: Daily Three Bar Scan

on:
  workflow_dispatch:
    inputs:
      target_dates:
        description: "扫描日期，格式 YYYYMMDD；多个日期用英文逗号分隔，例如 20260513,20260514。留空则默认中国当天日期。"
        required: false
        default: ""
      scan_script_path:
        description: "策略脚本路径，默认 three_bar_play_multi_dates.py"
        required: false
        default: "three_bar_play_multi_dates.py"

  schedule:
    # UTC 时间。北京时间 = UTC + 8
    # 这里是北京时间 周一到周五 18:30 运行
    - cron: "30 10 * * 1-5"

jobs:
  run-scan:
    runs-on: ubuntu-latest

    env:
      # 策略脚本
      SCAN_SCRIPT_PATH: ${{ github.event.inputs.scan_script_path || 'three_bar_play_multi_dates.py' }}

      # 日期：手动运行时可填；定时运行时为空，由 github_entry.py 自动使用中国当天日期
      TARGET_DATES: ${{ github.event.inputs.target_dates }}

      # Tushare
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      # 邮件配置
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

      # 可选运行参数
      START_DATE: ${{ secrets.START_DATE }}
      MAX_WORKERS: ${{ secrets.MAX_WORKERS }}
      TEST_LIMIT: ${{ secrets.TEST_LIMIT }}
      BATCH_START: ${{ secrets.BATCH_START }}
      BATCH_SIZE: ${{ secrets.BATCH_SIZE }}
      SLEEP_SEC: ${{ secrets.SLEEP_SEC }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Automation files:"
          ls -la automation || true
          echo "Data files:"
          ls -la data || true

      - name: Run scan and send email
        run: |
          python automation/github_entry.py

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-bar-scan-outputs
          path: |
            outputs/
            output/
          if-no-files-found: ignore
