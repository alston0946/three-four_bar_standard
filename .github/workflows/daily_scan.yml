name: Daily ThreeBar Scan

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "可选，手动指定扫描日期（YYYYMMDD）"
        required: false
        type: string
  schedule:
    - cron: '7 9 * * 1-5'   # 17:07 Asia/Singapore = 09:07 UTC

jobs:
  run-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_DATE: ${{ inputs.target_date }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SCAN_SCRIPT_PATH: ${{ secrets.SCAN_SCRIPT_PATH }}
      CODE_FILE: ${{ secrets.CODE_FILE }}
      BELOW_8B_FILE: ${{ secrets.BELOW_8B_FILE }}
      ST_FILE: ${{ secrets.ST_FILE }}
      START_DATE: ${{ secrets.START_DATE }}
      MAX_WORKERS: ${{ secrets.MAX_WORKERS }}
      BATCH_START: ${{ secrets.BATCH_START }}
      BATCH_SIZE: ${{ secrets.BATCH_SIZE }}
      TEST_LIMIT: ${{ secrets.TEST_LIMIT }}
      SLEEP_SEC: ${{ secrets.SLEEP_SEC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan and send email
        run: python automation/github_entry.py

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threebar-outputs
          path: outputs/
          if-no-files-found: warn
